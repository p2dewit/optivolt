<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative OptiVolt 1.0 Optimizer overview</title>
  <desc id="desc">A fictional sample-data interface illustration showing the OptiVolt header, strategy selector, Day Actuals chart, and Optimized Plan chart.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f8"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#0f172a}.muted{fill:#64748b}.tiny{font-size:13px}.small{font-size:16px}.body{font-size:18px}.label{font-size:14px;font-weight:700;letter-spacing:2px;fill:#94a3b8}.title{font-size:24px;font-weight:700}.card{fill:#fff;stroke:#dbe3ec;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.axis{font-size:13px;fill:#64748b}.metric{font-size:14px;letter-spacing:1.2px;font-weight:700;fill:#64748b}.value{font-size:23px;font-weight:700}.pill{fill:#e0f2fe}.pilltext{font-size:14px;font-weight:600;fill:#0369a1}
    </style>
  </defs>
