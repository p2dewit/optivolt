<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative OptiVolt optimizer controls and diagnostics</title>
  <desc id="desc">A fictional sample-data interface illustration of optimizer settings, Victron status, diagnostic charts, and schedule table.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f8"/></linearGradient>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#0f172a}.muted{fill:#64748b}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.label{font-size:13px;font-weight:700;letter-spacing:1.8px;fill:#94a3b8}.title{font-size:20px;font-weight:700}.card{fill:#fff;stroke:#dbe3ec;stroke-width:1.5}.grid{stroke:#e2e8f0;stroke-width:1}.axis{font-size:10px;fill:#64748b}.good{fill:#15803d}.blue{stroke:#0284c7;fill:none;stroke-width:3}.orange{stroke:#ea580c;fill:none;stroke-width:3}.green{stroke:#16a34a;fill:none;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="68" fill="#fff" stroke="#e2e8f0"/>
  <text x="46" y="44" font-size="27" font-weight="700">OptiVolt <tspan font-size="20" font-weight="400" fill="#94a3b8">DESS</tspan><tspan font-size="14" font-weight="400" fill="#94a3b8"> 1.0</tspan></text>
  <rect x="577" y="15" width="446" height="38" rx="19" fill="#f1f5f9"/><rect x="583" y="19" width="127" height="30" rx="15" fill="#fff" stroke="#dbe3ec"/><text x="601" y="39" class="small" font-weight="700" fill="#0369a1">Optimizer</text><text x="754" y="39" class="small muted">EV</text><text x="834" y="39" class="small muted">Predictions</text><text x="941" y="39" class="small muted">Settings</text>
  <text x="48" y="98" class="tiny muted">OPTIMIZER · CONTROLS AND DIAGNOSTICS</text><text x="1550" y="98" class="tiny muted" text-anchor="end">ILLUSTRATIVE VIEW · SAMPLE DATA</text>

  <rect x="48" y="116" width="470" height="508" rx="16" class="card"/>
  <text x="76" y="153" class="label">SETTINGS</text>
  <text x="76" y="192" class="small muted">Terminal SoC</text><rect x="76" y="202" width="194" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="89" y="226" class="small">Average</text><text x="251" y="226" class="small muted">⌄</text>
  <text x="294" y="192" class="small muted">Custom price</text><rect x="294" y="202" width="194" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="307" y="226" class="small">—</text><text x="454" y="226" class="tiny muted">c€/kWh</text>
  <rect x="76" y="260" width="38" height="22" rx="11" fill="#38bdf8"/><circle cx="102" cy="271" r="8" fill="#fff"/><text x="126" y="276" class="small">Update data before recompute</text>
  <rect x="76" y="301" width="38" height="22" rx="11" fill="#cbd5e1"/><circle cx="88" cy="312" r="8" fill="#fff"/><text x="126" y="317" class="small">Push schedule to Victron</text>
  <rect x="320" y="292" width="168" height="50" rx="8" fill="#f8fafc" stroke="#dbe3ec"/>
  <text x="332" y="312" class="tiny muted">Mode: ✓</text><text x="414" y="312" class="tiny muted">Correct plan: ✓</text><text x="332" y="331" class="tiny good">Connected</text><text x="414" y="331" class="tiny good">Ready</text>
  <rect x="76" y="354" width="412" height="74" rx="10" fill="#f8fafc" stroke="#dbe3ec"/><text x="92" y="378" class="small" font-weight="600">Live block guard</text><rect x="92" y="389" width="380" height="27" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="104" y="408" class="tiny">Monitor only　⌄</text>
  <rect x="76" y="445" width="412" height="48" rx="9" fill="url(#blue)"/><text x="282" y="475" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Recompute</text>
  <text x="76" y="521" class="tiny muted">STATUS</text><text x="76" y="543" class="small good">Plan updated (14:35)</text>
  <line x1="76" y1="562" x2="488" y2="562" class="grid"/>
  <text x="76" y="589" class="tiny muted">NOW SLOT</text><text x="178" y="589" class="tiny muted">BATTERY SoC</text><text x="310" y="589" class="tiny muted">PLAN WINDOW</text>
  <text x="76" y="610" class="body" font-weight="700">14:45</text><text x="178" y="610" class="body" font-weight="700">62%</text><text x="310" y="610" class="body" font-weight="700">Today → +2 days</text>

  <rect x="542" y="116" width="490" height="242" rx="16" class="card"/>
  <text x="570" y="153" class="label">BATTERY SOC</text>
  <g transform="translate(574 180)"><line x1="0" y1="0" x2="426" y2="0" class="grid"/><line x1="0" y1="42" x2="426" y2="42" class="grid"/><line x1="0" y1="84" x2="426" y2="84" class="grid"/><line x1="0" y1="126" x2="426" y2="126" class="grid"/><path d="M0 105 C60 99 78 75 126 77 S190 56 234 61 S295 33 340 39 S393 21 426 15" class="green"/><text x="0" y="148" class="axis">Now</text><text x="200" y="148" class="axis">+1 day</text><text x="400" y="148" class="axis">Horizon</text></g>

  <rect x="1054" y="116" width="498" height="242" rx="16" class="card"/>
  <text x="1082" y="153" class="label">ENERGY PRICES</text><rect x="1373" y="130" width="148" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="1386" y="151" class="tiny good">82% · DA reliability</text>
  <g transform="translate(1084 184)"><line x1="0" y1="0" x2="438" y2="0" class="grid"/><line x1="0" y1="42" x2="438" y2="42" class="grid"/><line x1="0" y1="84" x2="438" y2="84" class="grid"/><line x1="0" y1="126" x2="438" y2="126" class="grid"/><path d="M0 102 L34 91 L68 106 L102 60 L136 73 L170 48 L204 93 L238 31 L272 56 L306 15 L340 75 L374 49 L408 67 L438 22" class="blue"/><path d="M0 110 L34 96 L68 93 L102 82 L136 83 L170 70 L204 77 L238 62 L272 66 L306 42 L340 53 L374 45 L408 40 L438 31" class="orange"/><text x="0" y="148" class="axis">Today</text><text x="206" y="148" class="axis">Tomorrow</text><text x="405" y="148" class="axis">Horizon</text></g>

  <rect x="542" y="378" width="1010" height="230" rx="16" class="card"/>
  <text x="570" y="415" class="label">PREDICTED LOAD AND SOLAR</text>
  <g transform="translate(574 443)"><line x1="0" y1="0" x2="944" y2="0" class="grid"/><line x1="0" y1="38" x2="944" y2="38" class="grid"/><line x1="0" y1="76" x2="944" y2="76" class="grid"/><line x1="0" y1="114" x2="944" y2="114" class="grid"/><path d="M0 76 C84 64 110 54 190 58 S305 80 390 74 S510 42 580 50 S670 76 755 67 S845 51 944 58" class="orange"/><path d="M0 112 C70 109 130 105 190 94 S300 45 390 32 S520 38 580 67 S680 108 755 112 S870 113 944 112" class="green"/><text x="0" y="137" class="axis">00:00</text><text x="224" y="137" class="axis">06:00</text><text x="464" y="137" class="axis">12:00</text><text x="704" y="137" class="axis">18:00</text><text x="900" y="137" class="axis">24:00</text></g>

  <rect x="48" y="644" width="1504" height="374" rx="16" class="card"/>
  <text x="76" y="683" class="label">SCHEDULE TABLE</text><text x="1518" y="683" class="tiny muted" text-anchor="end">Show DESS details　◉　Show kWh　◉</text>
  <g transform="translate(76 708)">
    <rect width="1448" height="36" rx="6" fill="#f1f5f9"/><text x="16" y="23" class="tiny" font-weight="700">TIME</text><text x="225" y="23" class="tiny" font-weight="700">GRID</text><text x="442" y="23" class="tiny" font-weight="700">BATTERY</text><text x="672" y="23" class="tiny" font-weight="700">PV</text><text x="900" y="23" class="tiny" font-weight="700">LOAD</text><text x="1128" y="23" class="tiny" font-weight="700">PRICE</text><text x="1344" y="23" class="tiny" font-weight="700">SOC</text>
    <g class="small"><line x1="0" y1="72" x2="1448" y2="72" class="grid"/><text x="16" y="61">14:45</text><text x="225" y="61">Import</text><text x="442" y="61">Charging</text><text x="672" y="61">—</text><text x="900" y="61">Home</text><text x="1128" y="61">€0.21</text><text x="1344" y="61">62%</text>
      <line x1="0" y1="108" x2="1448" y2="108" class="grid"/><text x="16" y="97">15:00</text><text x="225" y="97">Import</text><text x="442" y="97">Charging</text><text x="672" y="97">—</text><text x="900" y="97">Home</text><text x="1128" y="97">€0.19</text><text x="1344" y="97">66%</text>
      <line x1="0" y1="144" x2="1448" y2="144" class="grid"/><text x="16" y="133">15:15</text><text x="225" y="133">Export</text><text x="442" y="133">Discharging</text><text x="672" y="133">Solar</text><text x="900" y="133">Home</text><text x="1128" y="133">€0.24</text><text x="1344" y="133">65%</text>
      <line x1="0" y1="180" x2="1448" y2="180" class="grid"/><text x="16" y="169">15:30</text><text x="225" y="169">Balanced</text><text x="442" y="169">Idle</text><text x="672" y="169">Solar</text><text x="900" y="169">Home</text><text x="1128" y="169">€0.17</text><text x="1344" y="169">64%</text>
      <line x1="0" y1="216" x2="1448" y2="216" class="grid"/><text x="16" y="205">15:45</text><text x="225" y="205">Import</text><text x="442" y="205">Charging</text><text x="672" y="205">—</text><text x="900" y="205">Home</text><text x="1128" y="205">€0.16</text><text x="1344" y="205">68%</text></g>
  </g>
  <text x="1518" y="998" text-anchor="end" class="tiny muted">Illustrative values only — not live installation data.</text>
</svg>
